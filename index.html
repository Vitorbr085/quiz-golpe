<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>É golpe ou não? | FB Negócios</title>
  <meta name="description" content="Teste se você sabe reconhecer os sinais de golpe no crédito consignado." />
  <link rel="icon" type="image/svg+xml" href="https://vitorbr085.github.io/FB-negocios/assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="quiz.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol><symbol id="i-whatsapp" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></symbol></svg>
  <main>
    <!-- QUIZ: É GOLPE OU NÃO? -->
    <section class="section quiz-sec" id="seguranca">
      <div class="container quiz-grid">
        <div class="quiz-intro">
          <span class="eyebrow">Segurança em primeiro lugar</span>
          <h2 class="section-title">É golpe <span class="grad">ou não?</span></h2>
          <p class="muted">Golpes no consignado fazem vítimas todos os dias. Teste se você sabe reconhecer os sinais: arraste o cartão para o lado ou use os botões.</p>
          <ul class="quiz-legend" aria-hidden="true">
            <li><span class="quiz-key quiz-key--golpe">←</span> Golpe</li>
            <li><span class="quiz-key quiz-key--seguro">→</span> Seguro</li>
          </ul>
        </div>
        <div class="quiz" id="quiz" aria-live="polite">
          <div class="quiz__top" id="quizTop">
            <span class="quiz__count" id="quizCount">1 / 8</span>
            <div class="quiz__bar"><span id="quizBar"></span></div>
            <span class="quiz__score" id="quizScore">0 acertos</span>
            <button type="button" class="quiz__exit" id="quizExit" aria-label="Sair do teste e voltar ao início"><span aria-hidden="true">✕</span> Sair</button>
          </div>
          <div class="quiz__stage" id="quizStage"></div>
          <div class="quiz__actions" id="quizActions">
            <button type="button" class="quiz__btn quiz__btn--golpe" data-ans="golpe"><span aria-hidden="true">✕</span> É golpe</button>
            <button type="button" class="quiz__btn quiz__btn--seguro" data-ans="seguro"><span aria-hidden="true">✓</span> É seguro</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="quiz.js"></script>
</body>
</html>
